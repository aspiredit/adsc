<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — Autism Dads Social Club</title>
<meta name="theme-color" content="#1F5E96">
<link rel="icon" href="/assets/icons/icon-192.png">
<style>
  :root {
    --blue-deep: #1F5E96;
    --bg: #F8FAFC;
    --ink: #1A2B30;
    --ink-soft: #4A5A60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  .card { max-width: 420px; }
  img { width: 104px; height: 104px; margin-bottom: 20px; }
  h1 { font-size: 1.5rem; margin: 0 0 12px; }
  p { color: var(--ink-soft); line-height: 1.6; margin: 0 0 24px; }
  button {
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--blue-deep);
    border: 0;
    border-radius: 999px;
    padding: 13px 30px;
    cursor: pointer;
  }
  button:hover { background: #17486f; }
</style>
</head>
<body>
  <div class="card">
    <img src="/assets/icons/icon-192.png" alt="Autism Dads Social Club">
    <h1>You're offline</h1>
    <p>We can't reach the site right now. Any pages you've already opened are still available — and your saved event reminders will still go off on time.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
